<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cadence — Daily Task Tracker</title>
  <meta name="description" content="A calm personal tracker for daily recurring tasks, projects and subtasks — with day-by-day history. Runs entirely in your browser." />
  <meta id="themeColor" name="theme-color" content="#F4F6F8" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/>
        </svg>
        <span class="brand-name">Cadence</span>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">&times;</button>
      </div>

      <nav class="views">
        <button class="nav-item" data-view="today">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
          <span>Today</span><span class="count" id="cntToday"></span>
        </button>
        <button class="nav-item" data-view="all">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          <span>All tasks</span>
        </button>
      </nav>

      <div class="section-label">Projects</div>
      <nav class="projects" id="projectList"></nav>
      <button class="add-project" id="addProjectBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New project
      </button>

      <div class="sidebar-footer">
        <button class="icon-btn" id="themeToggle" title="Theme" aria-label="Toggle theme"></button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="day-nav">
          <button class="icon-btn" id="prevDay" aria-label="Previous day">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="day-title">
            <h1 id="dayTitle">—</h1>
            <button class="today-pill" id="todayBtn">Today</button>
          </div>
          <button class="icon-btn" id="nextDay" aria-label="Next day">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search tasks…" aria-label="Search tasks" />
        </div>
      </header>

      <div class="scroll">
        <div class="sheet">
          <section class="hero">
            <svg class="ring" viewBox="0 0 48 48">
              <circle class="track" cx="24" cy="24" r="20" fill="none" stroke-width="4"/>
              <circle class="bar" id="ringBar" cx="24" cy="24" r="20" fill="none" stroke-width="4" stroke-dasharray="125.6" stroke-dashoffset="125.6"/>
            </svg>
            <div class="hero-text">
              <span class="hero-count" id="heroCount">—</span>
              <span class="hero-sub" id="heroSub"></span>
            </div>
            <span class="hero-pct" id="heroPct"></span>
          </section>

          <div class="add-bar">
            <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            <input id="newTask" type="text" placeholder="Add a task — press Enter" aria-label="Add a task" />
            <span class="hint">Repeats daily by default</span>
          </div>

          <section id="taskList"></section>
        </div>
      </div>
    </main>
  </div>

  <!-- Overlay (shared by sidebar drawer + detail) -->
  <div class="overlay" id="overlay"></div>

  <!-- Task detail slide-over -->
  <aside class="detail" id="detail" aria-label="Task details">
    <div class="detail-head">
      <button class="check" id="detailCheck" aria-label="Toggle complete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
      <h2 id="detailTitleText">Task</h2>
      <button class="icon-btn" id="detailClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </aside>

  <!-- Modals + toasts -->
  <div class="modal-wrap" id="modalWrap"></div>
  <div id="toast"></div>

  <script src="./store.js"></script>
  <script src="./app.js"></script>
</body>
</html>
